name: Development CI

on:
  workflow_dispatch:
  push:
    branches: '*'


jobs:

  native:
    strategy:
      fail-fast: false
      matrix:
        platform: 
          - macos-15
          - macos-15-intel
          - macos-latest
    runs-on: ${{ matrix.platform }}

    steps:
      - run: xcodebuild -showsdks
      - run: ls -al "$(xcode-select -p)/Platforms/MacOSX.platform/Developer/SDKs/"
      - run: xcrun --sdk macosx --show-sdk-version
      - run: xcrun --sdk macosx --show-sdk-path
      - run: xcode-select -p
